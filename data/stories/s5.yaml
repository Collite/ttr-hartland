# S5 — the area managers place PoS material with different efficiency (design 04 §S5). A skilled manager places
# displays where `display_uplift` is high (choice ∝ uplift ^ (skill × 3)), an unskilled one at random.
story: S5
title_cs: Oblastní manažeři využívají stojany s různou efektivitou
enabled: true
seed_stream: pos
parameters:
  # The six managers' pos_skill, by the region they manage; SMS's is the unskilled but generous one.
  pos_skill: { PHA: 1.4, JMV: 1.3, SJC: 1.0, ZSC: 0.6, VCH: 0.5, SMS: 0.5 }
  budget_factor: { SMS: 1.5 }
  display_uplift_base: 0.25 # × street fit × size fit: a hypermarket's coffee aisle 0.35, a village shop 0.08
  choice_exponent: 3
  skilled_giveaway_cut: 0.30 # skilled managers hand out 30 % fewer give-aways, where visits convert
detector:
  sql: detectors/s5.sql
  metric: return_rank_vs_skill_rank # Spearman's rho over the six regions
  threshold: 0.8
  direction: ">="
  null_world: "<"
also:
  - sql: detectors/s5_best_worst.sql
    metric: best_over_worst_gain_per_cost
    # Provisional. 04 set the 3 for the return; gain ÷ cost is 1 + the return, so the same story reads smaller (returns
    # of 1.5 and 0.3, 5× apart, give 2.5 ÷ 1.3 = 1.92). G2 S2.3 T1, which builds display_uplift's street × size grid,
    # derives the spread that grid gives over the market (as s2.yaml derives S2-affluence's) and sets the threshold
    # between it and the null world's 1.0: from the mechanics, before the first build (stories README).
    threshold: 3
    direction: ">="
    null_world: "<"
