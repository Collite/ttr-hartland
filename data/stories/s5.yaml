# S5 — the area managers place PoS material with different efficiency (design 04 §S5). Every manager chooses the
# stores ∝ uplift ^ (pos_skill × choice_exponent): the skilled sharply, the weak nearly at random (review-248 ⚑R248-A).
story: S5
title_cs: Oblastní manažeři využívají stojany s různou efektivitou
enabled: true
seed_stream: pos
parameters:
  # The six managers' pos_skill, by the region they manage; SMS's is the unskilled but generous one.
  pos_skill: { PHA: 1.4, JMV: 1.3, SJC: 1.0, ZSC: 0.6, VCH: 0.5, SMS: 0.5 }
  budget_factor: { SMS: 1.5 } # × the region's PoS budget: its displays (world.yaml field.pos_budget), its give-aways
  # A display's uplift at a store (G2 S2.3 T1, `loop.pos.Grid`): the base × its street type's fit × its size class's —
  # a hypermarket's coffee aisle in a shopping centre 0.25 × 1.0 × 1.4 = 0.35, a village shop 0.25 × 0.4 × 0.8 = 0.08.
  # The null world's is `null_uplift` at every store.
  display_uplift_base: 0.25
  street_fit: { shopping_centre: 1.0, high_street: 1.0, transport_hub: 0.9, residential: 0.7, petrol: 0.6, village: 0.4 }
  size_fit: { L: 1.4, M: 1.0, S: 0.8 }
  null_uplift: 0.15
  choice_exponent: 3 # a manager chooses a store ∝ its uplift ^ (pos_skill × this)
  # A manager of pos_skill above `skilled_above` is skilled: withdraws a display whose measured uplift is below
  # `withdraw_below` after its first `withdraw_after_months`, and hands out `skilled_giveaway_cut` fewer give-aways,
  # all at the stores whose conversion beats the area's median (their sales calls under their tourplans, across reps).
  skilled_above: 1.0
  withdraw_after_months: 3
  withdraw_below: 0.05
  skilled_giveaway_cut: 0.30
detector:
  sql: detectors/s5.sql
  metric: return_rank_vs_skill_rank # Spearman's rho over the six regions
  threshold: 0.8
  direction: ">="
  null_world: "<"
also:
  - sql: detectors/s5_best_worst.sql
    metric: best_over_worst_gain_per_cost
    # Derived at G2 S2.3 T6 from the mechanics, before the first build (review-199 R199-B/C; `checks.s5_expected`):
    # over the opening market the story's expected gain ÷ cost is PHA 7.10 ÷ VCH 4.61 = 1.54, the null world's 3.82 ÷
    # 3.15 = 1.21 — not 1.0: Prague's stores sell more, so its displays gain more whoever places them. The threshold is
    # their geometric mean, to the 0.05 below: 1.35. G5 S5.2 does not retune it (stories README).
    # It is provisional — S2.4 corrects the gain and re-derives this threshold (NH-D17); it is not certified.
    threshold: 1.35
    direction: ">="
    null_world: "<"
