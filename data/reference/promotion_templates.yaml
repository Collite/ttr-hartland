# The promotion calendar's shapes (⚑NH-8): ~25 promotions a year, a third TV-supported, each 4–8 weeks, all four
# mechanics, 2–3 exclusion pairs and ~4 key-account-only promotions a year. A year's calendar is every template
# instantiated for that year (`setup.promotions.calendar`), so the codes are stable: PR-<year>-<month>-<line>-<tag>.
# Schema: data/schemas/promotion_templates.schema.json. SKUs by catalogue.csv's sku_code.
#
# The TV-supported eight are S2's (stories/s2.yaml): Gold ×3, Espresso and Premium soups against Classic, Mixes and
# Dried soups, with the same mechanics on both sides. October's Classic 200 g price-off is A-10's.
#
# Two promotions of one line that an order could both qualify for (their eligibility meets) never share a day unless
# they exclude each other (`setup.promotions.clashes`, tested for every year to 2035).

templates:
  # ── TV-supported ───────────────────────────────────────────────────────────
