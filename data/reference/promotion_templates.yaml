    tag: TV
    month: 3
    start_week: 10
    weeks: 4
    tv: true
    mechanic: price_off
    discount_pct: 20
    target_uplift_pct: 40
    eligibility: { channel: [big_retail, small_retail, gas_ka, web] }
    name_cs: Harcafé Gold – jarní televizní sleva
    goal_cs: Získat zpět kupující prémiové kávy po zimní sezóně a podpořit jarní televizní kampaň.
