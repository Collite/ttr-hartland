# The inventory — the machine-readable twin of design 03 (the data inventory) and 06 §3 (the documents), contracts §1.
# One source, three readers: `just ddl` renders data/ddl/schema.sql + indexes.sql from it; `load-world` copies in its
# `load_order`; the model's db layer is imported from the rendered DDL and drift-checked against it.
#
# Changing a table = edit this file → `just ddl` → the db layer by hand → `ddl-drift` clean, in one PR.
#
# A table: `name` · `group` (the model's db files) · `grain` · `columns` · `pk` · `load_order` (an integer; every
# foreign key points to a lower one, or to its own table) · `writer` · `rows_expected` (03's figure) · `serves`
# (stories S1–S6, demonstrations H-A…H-N) · `id_key` (the business key the id is hashed from, contracts §2; absent
# when the primary key is the business key itself) · `indexes` (indexes.sql, applied after the load) · `unique` ·
# `docwh: false` (an answer the DocWH is scored against: the hartland_docwh role gets no grant on it).
# `id_key` names the parts of the business key, which need not be columns: a parent's own key (`customer`), a sequence
# (`seq`). The generator passes them by these names (S1.1's `row_id(table, **key)`).
# A column: `name` · `type` · `nullable` (false when absent; contracts §1's `null`, which YAML would read as a null
# key) · `ref: <table>.<column>` (a foreign key, DEFERRABLE INITIALLY DEFERRED) · `coded: <codes name>` (its values and
# their Czech labels, below; a CHECK in the DDL) · `label_cs` (the column's Czech label, where the model fixes one) ·
# `docwh: false` (hidden from hartland_docwh, which then gets its table column by column). A column whose `ref` is
# `document.document_id` is hidden from it too: it says which promotion, price list or SKU a document describes.
# A view: `kind: materialized_view` (or `view`), `sql_file` under data/ddl/views/ and `docwh`, as a table's.
#
# Not here (contracts §1): `_sim_meta` and `_sim_checkpoint`, the generator's own (created by `load-world`).

