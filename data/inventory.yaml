tables:
  # ── reference ─────────────────────────────────────────────────────────────
  - name: legal_entity
    group: reference
    grain: a company of the group (the Center and three factories)
    columns:
      - { name: legal_entity_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
      - { name: ico, type: text }
      - { name: role, type: text, coded: legal_entity_role }
    pk: [legal_entity_id]
    id_key: [code]
    unique: [[code]]
    load_order: 10
    writer: setup
    rows_expected: 4
    serves: []

  - name: kraj
    group: reference
    grain: a Czech region (CZ-NUTS 3)
    columns:
      - { name: kraj_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
    pk: [kraj_id]
    id_key: [code]
    unique: [[code]]
    load_order: 20
    writer: setup
    rows_expected: 14
    serves: []

  - name: okres
    group: reference
    grain: a Czech district (LAU 1) or one of Prague's 22 administrative districts
    columns:
      - { name: okres_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
      - { name: kraj_id, type: bigint, ref: kraj.kraj_id }
      - { name: parent_okres_id, type: bigint, nullable: true, ref: okres.okres_id }
      - { name: affluence_index, type: "numeric(4,3)", label_cs: index bohatosti }
      - { name: population, type: integer }
    pk: [okres_id]
    id_key: [code]
    unique: [[code]]
    load_order: 30
    writer: setup
    rows_expected: 99
    serves: [S2, S4]

  - name: site
    group: reference
    grain: a physical site of the group (the Center, 3 factories, 2 DCs, 12 own shops)
    columns:
      - { name: site_id, type: bigint }
      - { name: code, type: text }
      - { name: kind, type: text, coded: site_kind }
      - { name: legal_entity_id, type: bigint, ref: legal_entity.legal_entity_id }
      - { name: name, type: text }
      - { name: town, type: text }
      - { name: okres_id, type: bigint, ref: okres.okres_id }
      - { name: lat, type: "numeric(9,6)" }
      - { name: lon, type: "numeric(9,6)" }
    pk: [site_id]
    id_key: [code]
    unique: [[code]]
    load_order: 40
    writer: setup
    rows_expected: 18
    serves: []

  - name: calendar
    group: reference
    grain: a day, 2023-01-01 → 2027-12-31
    columns:
      - { name: day, type: date }
      - { name: year, type: integer }
      - { name: quarter, type: integer }
      - { name: month, type: integer }
      - { name: week, type: integer }
      - { name: iso_year, type: integer }
      - { name: weekday, type: integer }
      - { name: weekday_cs, type: text }
      - { name: is_working_day, type: boolean }
      - { name: holiday_cs, type: text, nullable: true }
      - { name: season, type: text, coded: season }
    pk: [day]
    load_order: 50
    writer: setup
    rows_expected: 1826
    serves: [S1]

  - name: cost_centre
    group: org
    grain: a cost centre of the Center (one per unit and team, and per site)
    columns:
      - { name: cost_centre_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
      - { name: unit, type: text, coded: unit }
      - { name: site_id, type: bigint, nullable: true, ref: site.site_id }
    pk: [cost_centre_id]
    id_key: [code]
    unique: [[code]]
    load_order: 60
    writer: setup
    rows_expected: 37
    serves: []

  # ── org ───────────────────────────────────────────────────────────────────
  - name: org_unit
    group: org
    grain: a unit or team of the Center (its five units and their teams)
    columns:
      - { name: org_unit_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
      - { name: parent_org_unit_id, type: bigint, nullable: true, ref: org_unit.org_unit_id }
      - { name: cost_centre_id, type: bigint, ref: cost_centre.cost_centre_id }
    pk: [org_unit_id]
    id_key: [code]
    unique: [[code]]
    load_order: 70
    writer: setup
    rows_expected: 25
    serves: [H-H]

  - name: employee
    group: org
    grain: a person (reps, area managers, KAMs, product managers, dispatchers, staff), turnover included
    columns:
      - { name: employee_id, type: bigint }
      - { name: code, type: text, label_cs: uživatelské jméno }
      - { name: first_name, type: text }
      - { name: last_name, type: text }
      - { name: org_unit_id, type: bigint, ref: org_unit.org_unit_id }
      - { name: role, type: text, coded: employee_role }
      - { name: manager_employee_id, type: bigint, nullable: true, ref: employee.employee_id }
      - { name: hired_on, type: date }
      - { name: left_on, type: date, nullable: true }
    pk: [employee_id]
    id_key: [code]
    unique: [[code]]
    load_order: 80
    writer: [setup, month_end]
    rows_expected: 140
    serves: [S3, S5, S6, H-H]

  - name: region
    group: reference
    grain: a sales region (6), each under an area manager
    columns:
      - { name: region_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
      - { name: area_manager_employee_id, type: bigint, ref: employee.employee_id }
    pk: [region_id]
    id_key: [code]
    unique: [[code]]
    load_order: 90
    writer: setup
    rows_expected: 6
    serves: [S5, H-H]

  - name: area
    group: reference
    grain: a rep's territory (≈ 2 okresy; 10 in Praha)
    columns:
      - { name: area_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
      - { name: region_id, type: bigint, ref: region.region_id }
    pk: [area_id]
    id_key: [code]
    unique: [[code]]
    load_order: 100
    writer: setup
    rows_expected: 50
    serves: [S3, S5]

  - name: area_okres
    group: reference
    grain: an okres in an area (each okres in exactly one)
    columns:
      - { name: area_id, type: bigint, ref: area.area_id }
      - { name: okres_id, type: bigint, ref: okres.okres_id }
    pk: [area_id, okres_id]
    unique: [[okres_id]]
    load_order: 110
    writer: setup
    rows_expected: 99
    serves: []

  - name: weather_daily
    group: reference
    grain: a sales region × a day
    columns:
      - { name: region_id, type: bigint, ref: region.region_id }
      - { name: day, type: date, ref: calendar.day }
      - { name: temp_mean_c, type: "numeric(4,1)" }
      - { name: precip_mm, type: "numeric(5,1)" }
      - { name: snow, type: boolean }
      - { name: severe, type: boolean }
    pk: [region_id, day]
    load_order: 120
    writer: daily
    rows_expected: 8000
    serves: [S1, H-E, H-F]

  # ── customers ─────────────────────────────────────────────────────────────
  - name: chain
    group: customers
    grain: a retail or station chain, or a franchise network
    columns:
      - { name: chain_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
      - { name: kind, type: text, coded: chain_kind }
      - { name: is_key_account, type: boolean }
    pk: [chain_id]
    id_key: [code]
    unique: [[code]]
    load_order: 130
    writer: setup
    rows_expected: 20
    serves: []

  - name: store
    group: customers
    grain: a physical store from OpenStreetMap — chain stores, independents, station shops, cafés; the market
    columns:
      - { name: store_id, type: bigint }
      - { name: osm_id, type: text }
      - { name: name, type: text }
      - { name: brand, type: text, nullable: true }
      - { name: chain_id, type: bigint, nullable: true, ref: chain.chain_id }
      - { name: store_class, type: text, coded: store_class, label_cs: typ prodejny }
      - { name: size_class, type: text, coded: size_class, label_cs: velikost prodejny }
      - { name: street_type, type: text, coded: street_type, label_cs: typ ulice }
      - { name: weekly_hours, type: "numeric(5,1)" }
      - { name: sunday_open, type: boolean }
      - { name: lat, type: "numeric(9,6)" }
      - { name: lon, type: "numeric(9,6)" }
      - { name: street, type: text, nullable: true }
      - { name: town, type: text, nullable: true }
      - { name: postcode, type: text, nullable: true }
      - { name: okres_id, type: bigint, ref: okres.okres_id }
      - { name: area_id, type: bigint, ref: area.area_id }
      - { name: opened_on, type: date, nullable: true }
      - { name: closed_on, type: date, nullable: true }
    pk: [store_id]
    id_key: [osm_id]
    unique: [[osm_id]]
    indexes: [[chain_id], [okres_id], [area_id]]
    load_order: 140
    writer: setup
    rows_expected: 12500
    serves: [S2, S4, H-A]

  - name: customer
    group: customers
    grain: >-
      a trading partner the Center invoices (a chain, a store, an operator, a restaurant, a wholesaler, an own shop,
      a web consumer), potential ones included
    columns:
      - { name: customer_id, type: bigint }
      - { name: code, type: text }
      - { name: name, type: text }
      - { name: channel, type: text, coded: channel, label_cs: kanál }
      - { name: sub_channel, type: text, nullable: true, coded: sub_channel, label_cs: podkanál }
      - { name: chain_id, type: bigint, nullable: true, ref: chain.chain_id }
      - { name: store_id, type: bigint, nullable: true, ref: store.store_id }
      - { name: okres_id, type: bigint, nullable: true, ref: okres.okres_id }
      - { name: legal_form, type: text, nullable: true }
      - { name: vat_id, type: text, nullable: true }
      - { name: payment_terms_days, type: integer }
      - { name: credit_limit, type: "numeric(14,2)", nullable: true }
