# NH-D28 design 11. Pilot/build provenance and held-out seed derivation stay on NH-D25/v1.
revision: NH-D28/v1
claim: placement_decision_quality # the managers' choices against their own forecasts: not a measured gain or payback
pilot_revision: s5-pilot-v1 # the decisions it evaluates: s5_protocol.yaml's revisions, unchanged
policy_revision: nh-d21-b-r1
window: { from: 2024-01-01, until: 2025-12-31 } # W: a round counts when its decision day + 1 is in it
rounds: 24 # per region: the month-ends 2023-12-31 … 2025-11-30, reported empty or not
support: { chosen_per_month: 2, unchosen_per_month: 2, unchosen: 100 }
# Common effective-calendar omissions of size one and two are part of the executable rule.
acceptance:
  q_high: 0.70 # the high group's mean Q
  difference: 0.10 # Q_H − Q_L, a fraction: ten percentage points
  high: [PHA, JMV]
  low: [ZSC, VCH, SMS]
labels:
  title_cs: Kvalita výběru umístění stojanů
  disclosure_cs: Podle předpovědi před rozhodnutím; nejde o prokázaný přírůstek marže.
  forecast_cs: Předpověď před rozhodnutím
  observed_cs: Skutečnost v období, nepřiřazená programu
  unavailable_cs: Přírůstek marže a návratnost stojanů nejsou změřeny.
seeds:
  # cert(i) = 1 + int.from_bytes(SHA256("NH-D25/v1/cert/" + str(i)).digest()[:8], "big") % (2**31 - 2), i = 1…10;
  # s5_protocol.yaml's certification seeds are retired, never built or read
  development: [31102026, 1797428728, 285672490] # s5_protocol.yaml's: development data only, never held-out
  certification:
    [895899358, 415492059, 825635122, 1696596641, 185226040, 1446297034, 695446812, 797865691, 1653856169, 1139534158]
