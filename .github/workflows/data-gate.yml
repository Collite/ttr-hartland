# The data gate (contracts §7): the generator's lint, types and unit tests, the reference data and the DDL drift on
# every pull request and every push to master; the Postgres tier (the DDL applied on Postgres 16) and the build tier
# (CSV builds of the world, the stories' pandas twins on them) as jobs of their own.
name: data-gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a PR's run. Every other run gets a group of its own (GitHub keeps one pending run per
# group and cancels the rest), so each master commit keeps its own gate record.
concurrency:
  group: data-gate-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2

      - name: uv sync (Python 3.13, the lock)
        run: uv sync --locked

      - name: just test (ruff · mypy --strict · pytest)
        run: just test

      - name: just reference-check
        run: just reference-check

      - name: just ddl --check
        run: just ddl --check

  component:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hartland
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest.py's pg_dsn makes a fresh database on this server per session (no testcontainers in CI).
      HARTLAND_TEST_PG: postgresql://postgres:hartland@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv sync (Python 3.13, the lock)
        run: uv sync --locked

      - name: pytest -m component (Postgres 16)
        run: uv run pytest -m component

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: uv sync (Python 3.13, the lock)
        run: uv sync --locked

      - name: pytest -m build (the story and the null world built to 2025, the stories, determinism and timing)
        run: uv run pytest -m build

  # The verb end to end, as a user runs it (G1 S1.4 T7): a three-month build, the answer key, and the twins over the
  # build. One quarter judges nothing (S1 and S4 need a year: `nan`, so FAIL, and the check exits 1): the step proves
  # the twins read the build it just made, not that the stories hold — the build tier judges them on 2024–2025.
  build-world:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: extractions/setup-just@v2

      - name: uv sync (Python 3.13, the lock)
        run: uv sync --locked

      - name: just build-world --until 2024-03-31 --csv
        run: just build-world --until 2024-03-31 --csv --run ci-3-months

      - name: just stories-check --dry (the answer key)
        run: just stories-check --dry

      # `stories.md` is written only after every twin has run, into a fresh run folder, and ends with "N of M run checks
      # pass": the grep fails when the check crashed or no twin ran (M = 0, every table missing), whatever the verdicts.
      - name: just stories-check --csv ci-3-months (the twins over the build; one quarter judges nothing)
        run: |
          just stories-check --csv ci-3-months || true
          grep -qE '^[0-9]+ of [1-9][0-9]* run checks pass' data/build/ci-3-months/stories.md
